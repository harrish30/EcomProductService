spring.application.name=EcomProductService
management.endpoints.web.exposure.include=mappings

#These are configuration values, not core business logic
#You generally don't want things that might change between environments—URLs,
#ports, credentials, feature flags, timeouts, etc.—hardcoded into your Java classes.
#FakeStoreAPI configurations
fakestore.api.base.url = https://fakestoreapi.com
fakestore.api.product.path = /products
fakestore.api.category.path = /category
fakestore.api.cart.for.user.path = /carts?userId=

#Datasource properties
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show-sql=true
spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/ecomproductserviceapplication
spring.datasource.username=root
spring.datasource.password=password